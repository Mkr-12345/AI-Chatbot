<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Python · OpenAI-compatible LLM API</p>
      <h1>AI Chatbot</h1>
    </div>
    <p id="status" class="status">Checking configuration…</p>
  </header>

  <main>
    <section class="panel chat-panel" aria-labelledby="chat-heading">
      <div class="panel-head">
        <h2 id="chat-heading">Conversation</h2>
        <label>
          System prompt
          <select id="prompt"></select>
        </label>
      </div>
      <p id="prompt-text" class="prompt-text"></p>
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <form id="chat-form" class="composer">
        <textarea id="message" rows="3" placeholder="Ask something. Earlier turns stay in context." required></textarea>
        <div class="row">
          <button type="submit">Send</button>
          <button type="button" id="clear" class="ghost">Clear history</button>
        </div>
      </form>
      <p id="chat-error" class="error" hidden></p>
    </section>

    <section class="panel lab-panel" aria-labelledby="lab-heading">
      <div class="panel-head">
        <h2 id="lab-heading">Prompt lab</h2>
      </div>
      <p class="hint">The same message is sent twice, each time with only that system prompt. Nothing from the conversation on the left is included.</p>
      <form id="compare-form" class="composer">
        <div class="split">
          <label>Prompt A<select id="prompt-a"></select></label>
          <label>Prompt B<select id="prompt-b"></select></label>
        </div>
        <textarea id="compare-message" rows="3" placeholder="One question, two instructions." required></textarea>
        <button type="submit">Compare</button>
      </form>
      <p id="compare-error" class="error" hidden></p>
      <div id="compare-results" class="results" hidden>
        <article>
          <h3 id="name-a"></h3>
          <p id="reply-a"></p>
        </article>
        <article>
          <h3 id="name-b"></h3>
          <p id="reply-b"></p>
        </article>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
